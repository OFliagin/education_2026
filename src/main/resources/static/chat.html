<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Agent Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>⚡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-page">

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">⚡ AI Agent Chat</span>
      <span class="session-dot" id="session-dot"></span>
    </div>

    <div class="sidebar-user" id="sidebar-user">User #—</div>

    <nav class="sidebar-nav">
      <a class="nav-item nav-item--active" href="chat.html">
        <span class="nav-icon">💬</span> Chat
      </a>
      <a class="nav-item" href="billing.html">
        <span class="nav-icon">💳</span> Billing
      </a>
    </nav>

    <!-- Context Window -->
    <div class="context-window">
      <div class="context-title">Context Window</div>
      <p class="context-text" id="context-text">Loading your stats…</p>
      <div class="context-stats">
        <div class="context-stat">
          <span class="context-stat-label">Score</span>
          <span class="context-stat-value" id="ctx-score">—</span>
        </div>
        <div class="context-stat">
          <span class="context-stat-label">Rank</span>
          <span class="context-stat-value" id="ctx-rank">—</span>
        </div>
      </div>

      <div class="context-tokens">
        <div class="context-token-header">
          <span class="context-stat-label">Tokens</span>
          <span class="context-token-total" id="ctx-token-total">—</span>
        </div>
        <div class="token-bar">
          <div class="token-bar-fill" id="ctx-token-bar" style="width:0%"></div>
        </div>
        <div class="context-token-footer">
          <span id="ctx-token-used">0</span> used &bull; <span id="ctx-token-remaining">—</span> left
          <span id="ctx-token-limit-badge" class="token-limit-badge hidden">Limit reached</span>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="btn-exit" onclick="logout()">Exit</button>
    </div>
  </aside>

  <!-- ── Chat ── -->
  <div class="chat-layout">
    <div class="chat-header">
      <span>AI Agent</span>
      <span class="session-label" id="session-label">session active</span>
    </div>

    <div class="messages" id="messages">
      <div class="message message--agent">
        <div class="bubble">Hi! I'm your AI Agent Chat assistant. Ask me anything about your account or payments.</div>
      </div>
    </div>

    <form class="chat-input-row" onsubmit="sendMessage(); return false;">
      <input id="chat-input" placeholder="Type a message…" autocomplete="off">
      <button type="submit" class="btn-send">Send</button>
      <button type="button" class="btn-delay" onclick="openDelayModal()">⏱ Delay</button>
    </form>

    <!-- Delay modal -->
    <div id="delay-modal" class="modal-backdrop hidden" onclick="closeDelayModal(event)">
      <div class="modal">
        <div class="modal-title">Schedule message</div>
        <div class="modal-body">
          <label class="modal-label">Period type</label>
          <select id="delay-period-type" class="modal-select">
            <option value="MINUTES">Minutes</option>
            <option value="HOURS">Hours</option>
            <option value="DAYS">Days</option>
          </select>
          <label class="modal-label">Value</label>
          <input id="delay-period-value" type="number" min="1" value="5" class="modal-input">
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeDelayModal()">Cancel</button>
          <button class="btn-send" onclick="sendDelayedMessage()">Schedule</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
